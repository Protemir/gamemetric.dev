<div id="boot" aria-hidden="true"><b>Сыбыс</b><i></i><span>Whispers of the Steppe</span></div>
<style>
#boot { position: fixed; inset: 0; z-index: 50; display: grid; place-content: center; justify-items: center; gap: 14px; background: radial-gradient(ellipse at 50% 70%, #5a3a2a, #1c1424 55%, #0c0910); transition: opacity 0.6s; }
#boot b { font: 700 clamp(42px, 9vw, 86px) Georgia, serif; letter-spacing: 0.08em; color: #f2c25a; text-shadow: 0 4px 18px rgba(0,0,0,.6); }
#boot span { font: italic 16px Georgia, serif; color: #d9c6a2; }
#boot i { width: min(260px, 60vw); height: 3px; border-radius: 2px; background: linear-gradient(90deg, #f2c25a 0 40%, rgba(242,194,90,.2) 40%); background-size: 250% 100%; animation: bootbar 1.2s linear infinite; }
@keyframes bootbar { from { background-position: 100% 0; } to { background-position: -150% 0; } }
#boot.gone { opacity: 0; pointer-events: none; }
</style>
<canvas id="game" aria-label="Whispers of the Steppe"></canvas>

  <button type="button" class="icon" id="soundBtn" aria-label="Sound"></button>
</header>
<nav class="actions" id="actions" hidden></nav>
<p class="hint" id="hint" aria-live="polite"></p>
<div class="toasts" id="toasts"></div>

<div id="ui"></div>
