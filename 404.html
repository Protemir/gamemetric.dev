<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GameMetric: page not found</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark light; --bg: #0f1011; --text: #ecedee; --muted: #9ba0a6; --accent: #c2ec5a; }
  @media (prefers-color-scheme: light) { :root { --bg: #f2f3f4; --text: #15171a; --muted: #565b62; } }
  body { margin: 0; min-height: 100dvh; display: grid; place-items: center; background: var(--bg); color: var(--text);
         font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif; text-align: center; padding: 24px; }
  h1 { font-size: clamp(2rem, 8vw, 3.5rem); margin: 0 0 8px; letter-spacing: -0.03em; }
  p { color: var(--muted); margin: 0 0 24px; }
  a { display: inline-block; padding: 12px 24px; border-radius: 999px; background: var(--accent); color: #12160a; font-weight: 700; text-decoration: none; }
</style>
</head>
<body>
<main>
  <h1>Missed the target</h1>

  <a href="/">To the tests</a>
</main>
