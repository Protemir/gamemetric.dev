<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Асық — асық ату в браузере: лето 1987-го в ауле под горами</title>
<meta name="description" content="Асық ату от первого лица: бросай сақу из руки, выбивай асыки из кона, обыграй Ерлан-аға и Даурен-аға. Аул под горами, лето 1987-го, соседские ребята. Бесплатно, без скачивания, на телефоне и ПК.">
<meta property="og:image" content="https://gamemetric.dev/img/asyk.jpg">
<meta name="theme-color" content="#8a8a52">
<link rel="icon" href="favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="style.css">
<script type="module" src="js/main.js"></script>
</head>
<body>
<canvas id="game" aria-label="Асық"></canvas>
<header class="hud" id="hud" hidden>
  <button type="button" class="icon" id="menuBtn" aria-label="Меню"><svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" fill="none"/></svg></button>
  <button type="button" class="icon" id="soundBtn" aria-label="Звук"></button>
  <div class="hud-mid">
    <p class="hud-kon"><b id="hudKon"></b> <span id="hudScore"></span></p>
    <div class="bar"><i id="hudBar"></i></div>
  </div>
  <div class="throws" id="hudThrows" aria-label="Броски"></div>
</header>
<footer class="turn" id="turn" hidden>
  <div class="calc">
    <span class="box chips" id="turnChips">0</span>
    <span class="x">×</span>
    <span class="box mult" id="turnMult">1</span>
  </div>
  <p class="turn-note" id="turnNote"></p>
</footer>
<p class="hint-line" id="hint" aria-live="polite"></p>
<div class="talk" id="talk" hidden>
  <div class="talk-pic" id="talkPic"></div>
  <div class="talk-body">
    <b class="talk-name" id="talkName"></b>
    <p class="talk-text" id="talkText" aria-live="polite"></p>
  </div>
  <span class="talk-next" aria-hidden="true">▸</span>
</div>
<div class="film" id="filmBox" hidden>
  <video id="film" playsinline preload="auto"></video>
  <button type="button" class="film-skip" id="filmSkip">▸▸</button>
</div>
<div id="ui"></div>
</body>
</html>
