<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Не отворачивайся</title>
    <link rel="icon" href="data:,"> <!-- без иконки браузер просил /favicon.ico и писал 404 в консоль -->
    <style>
      html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; overscroll-behavior: none; }
      /* телефон: касания — игре, а не браузеру (без зума двойным тапом, «назад» свайпом, обновления потягиванием) */
      html, body, #unity-canvas { touch-action: none; -webkit-tap-highlight-color: transparent; }
      /* планшеты: долгое касание не выделяет текст и не открывает лупу (требование CrazyGames) */
      body { -webkit-user-select: none; -moz-user-select: none; -ms-user-select: none; user-select: none; -webkit-touch-callout: none; }
      #unity-canvas { position: fixed; inset: 0; width: 100%; height: 100%; background: #000; display: block; outline: none; }
      #loading { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; flex-direction: column; gap: 14px;
                 color: #6d6a64; font: 13px/1.4 system-ui, sans-serif; letter-spacing: .2em; pointer-events: none; }
      #bar { width: 180px; height: 2px; background: #1a1a1a; }
      #fill { width: 0; height: 100%; background: #8a857c; transition: width .15s; }
      #err { position: fixed; left: 16px; right: 16px; bottom: 16px; color: #c66; font: 13px system-ui, sans-serif; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="loading"><div id="bar"><div id="fill"></div></div><div id="name">НЕ ОТВОРАЧИВАЙСЯ</div></div>
    <div id="err"></div>
    <script src="https://sdk.crazygames.com/crazygames-sdk-v3.js"></script>
    <script>window.LW_PORTAL = "crazygames";</script>
    <script>
      // название по языку браузера, как и в самой игре (?lang=ru|en)
      (function () {
        var q = /[?&]lang=(ru|en)/.exec(location.search), lang = q ? q[1] : (/^(ru|uk|be)/i.test(navigator.language || "") ? "ru" : "en");
        if (lang === "en") { document.title = "Hold Their Gaze"; document.documentElement.lang = "en"; document.getElementById("name").textContent = "HOLD THEIR GAZE"; }
      })();
    </script>
    <script>
      // Chrome не даёт снова захватить мышь сразу после Esc и бросает SecurityError; Unity показывала это окном с ошибкой.
      // Глушим только эту ошибку: захват сработает со следующего клика.
      (function () {
        var lockErr = function (x) { return /pointer ?lock/i.test(String(x && (x.message || x))); };
        var rpl = HTMLCanvasElement.prototype.requestPointerLock;
        HTMLCanvasElement.prototype.requestPointerLock = function (o) {
          if (!rpl) return; // мобильные браузеры: захвата мыши нет вовсе
          try { var p = rpl.call(this, o); if (p && p.catch) p.catch(function () {}); return p; } catch (e) { if (!lockErr(e)) throw e; }
        };
        window.addEventListener("unhandledrejection", function (e) { if (lockErr(e.reason)) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
        window.addEventListener("error", function (e) { if (lockErr(e.error || e.message)) { e.preventDefault(); e.stopImmediatePropagation(); } }, true);
      })();
    </script>
    <script>
      // портал: tools/build-cg.mjs кладёт на страницу SDK CrazyGames v3 и window.LW_PORTAL = "crazygames".
      // Игра шлёт события через Portal.jslib → window.lwPortal: loadingStop, gameplayStart, gameplayStop. На своём сайте — ничего
      (function () {
        if (window.LW_PORTAL !== "crazygames" || !window.CrazyGames || !window.CrazyGames.SDK) return;
        var sdk = window.CrazyGames.SDK, ready = sdk.init().then(function () { sdk.game.loadingStart(); }).catch(function (e) { console.warn("[lookaway] portal init", e); });
        window.lwPortal = function (e) {
          ready.then(function () {
            if (e === "loadingStop") sdk.game.loadingStop();
            else if (e === "gameplayStart") sdk.game.gameplayStart();
            else if (e === "gameplayStop") sdk.game.gameplayStop();
          }).catch(function () {});
        };
      })();
    </script>
    <script>
      // замер: время до первого кадра игры (игра пишет в лог FIRST_FRAME)
      window.__lw = { t0: performance.now(), loaded: null, firstFrame: null };
      // на localhost строки игры уходят на сервер (tools/serve.mjs печатает их) — для замеров FPS в обычном окне
      var beacon = location.hostname === "localhost" ? function (s) { fetch("/log", { method: "POST", body: s }).catch(function () {}); } : null;
      if (beacon) try {
        var gl = document.createElement("canvas").getContext("webgl2"), ext = gl && gl.getExtension("WEBGL_debug_renderer_info");
        beacon("gpu " + (ext ? gl.getParameter(ext.UNMASKED_RENDERER_WEBGL) : "?") + " dpr=" + devicePixelRatio + " " + innerWidth + "x" + innerHeight);
      } catch (e) {}
      ["log", "info", "warn", "error"].forEach(function (k) {
        var orig = console[k].bind(console);
        console[k] = function () {
          var s = arguments.length ? String(arguments[0]) : "";
          if (beacon && (s.indexOf("[lookaway]") >= 0 || k === "error")) beacon(Math.round(performance.now()) + " " + s);
          if (window.__lw.firstFrame === null && s.indexOf("FIRST_FRAME") >= 0) {
            window.__lw.firstFrame = Math.round(performance.now());
            orig("[lookaway] first frame at " + window.__lw.firstFrame + " ms");
          }
          return orig.apply(null, arguments);
        };
      });

      var canvas = document.querySelector("#unity-canvas");
      var mobile = /Android|iPhone|iPad|iPod|Mobile/i.test(navigator.userAgent) || (navigator.maxTouchPoints > 1 && /Macintosh/.test(navigator.userAgent));
      // телефон, не во фрейме портала: первое касание — на весь экран и лёгкая попытка закрепить горизонтальную ориентацию
      // (iPhone полноэкранный режим для страниц не даёт — там игра просто просит повернуть телефон)
      if (mobile && window.top === window) {
        var goFull = function () {
          var el = document.documentElement, rq = el.requestFullscreen || el.webkitRequestFullscreen;
          if (rq && !(document.fullscreenElement || document.webkitFullscreenElement)) {
            try { var p = rq.call(el, { navigationUI: "hide" }); if (p && p.then) p.then(function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); }).catch(function () {}); } catch (e) {}
          }
        };
        document.addEventListener("touchend", goFull, { passive: true });
      }
      var buildUrl = "Build";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/82834475deabad4b463b5596e5fbd60a.data.br",
        frameworkUrl: buildUrl + "/72365381d463eb543a5205399ba7de1d.framework.js.br",
        codeUrl: buildUrl + "/aa50deac4fe24cde5fa9d3d91dafc19a.wasm.br",
        streamingAssetsUrl: "StreamingAssets",
        companyName: "gamemetric",
        productName: "Lookaway",
        productVersion: "1.0",
        // 80 % разрешения на компьютере: под зерном не заметно, Intel UHD держит 60+ с мебелью и толпой.
        // Телефон: 0,8 от CSS-пикселя давало 675×312 на весь экран — мыльно, текст в пикселях; берём до 1,25
        devicePixelRatio: mobile ? Math.min(window.devicePixelRatio || 1, 1.25) : 0.8,
      };
      var script = document.createElement("script");
      script.src = buildUrl + "/5b77f5cdd4bddeae50be1b908ea5ea43.loader.js";
      script.onload = function () {
        createUnityInstance(canvas, config, function (p) {
          document.querySelector("#fill").style.width = (100 * p) + "%";
        }).then(function (inst) {
          window.__lw.loaded = Math.round(performance.now());
          window.unityInstance = inst;
          try {
            sessionStorage.removeItem("lwRetry");
            if (/[?&]r=\d+/.test(location.search)) history.replaceState(null, "", location.href.replace(/([?&])r=\d+&?/, "$1").replace(/[?&]$/, ""));
          } catch (e) {}
          document.querySelector("#loading").remove();
          canvas.focus();
          // свернули вкладку или переключились (телефон: другое приложение) — игра на паузе, звук молчит и на заставке
          document.addEventListener("visibilitychange", function () {
            try { inst.SendMessage("Game", document.hidden ? "PageHidden" : "PageVisible"); } catch (e) {}
          });
          // номер сборки (candidateId из tools/coord.mjs, иначе время сборки) — в журнал браузера и в угол меню
          fetch("build-info.json", { cache: "no-store" }).then(function (r) { return r.json(); }).then(function (b) {
            var id = b.candidateId || ("build " + (b.built || "?") + (b.commit ? " " + b.commit.slice(0, 7) : ""));
            window.__lw.build = id;
            console.log("[lookaway] build " + id + (b.dev ? " (dev)" : ""));
            inst.SendMessage("Game", "SetBuild", id);
          }).catch(function () {});
        }).catch(function (msg) {
          // Страница могла быть старой (из кэша браузера при восстановлении вкладки) и просить файлы прошлой сборки,
          // или связь оборвалась на середине: один раз перезагружаемся свежей страницей, потом уже показываем ошибку
          try {
            if (!sessionStorage.getItem("lwRetry")) {
              sessionStorage.setItem("lwRetry", "1");
              location.replace(location.pathname + (location.search ? location.search + "&" : "?") + "r=" + Date.now());
              return;
            }
            sessionStorage.removeItem("lwRetry");
          } catch (e) {}
          document.querySelector("#err").textContent = String(msg);
        });
      };
      document.body.appendChild(script);
      canvas.addEventListener("mousedown", function () { canvas.focus(); });
      // ссылка из игры (кнопка «Оставить отзыв»): адрес ставится на нажатии, открывается здесь — на отпускании, это жест пользователя
      // кнопка-ссылка (игра обновляет window.__lwLink каждый кадр, пока кнопка видна): открываем, только если и нажали,
      // и отпустили над ней — нажал, увёл и отпустил мимо — не открываем, как у обычной кнопки
      var linkDown = false;
      function overLink(e) {
        var l = window.__lwLink;
        if (!l || performance.now() - l.t > 700 || l.url.indexOf("https://") !== 0) return null;
        var r = canvas.getBoundingClientRect(), px = (e.clientX - r.left) * canvas.width / r.width, py = (e.clientY - r.top) * canvas.height / r.height;
        return px >= l.x && px <= l.x + l.w && py >= l.y && py <= l.y + l.h ? l.url : null;
      }
      document.addEventListener("pointerdown", function (e) { linkDown = !!overLink(e); });
      document.addEventListener("pointerup", function (e) {
        var u = linkDown ? overLink(e) : null; linkDown = false;
        if (u) window.open(u, "_blank", "noopener");
      });
      // Esc при захвате мыши браузер забирает себе: до игры не доходит ни клавиша, ни смена Cursor.lockState
      // (проверено 25.10 в Edge — мышь отпущена, а игра идёт дальше). Сообщаем игре сами.
      var hadPointer = false;
      document.addEventListener("pointerlockchange", function () {
        var on = !!document.pointerLockElement;
        if (hadPointer && !on && window.unityInstance) window.unityInstance.SendMessage("Game", "PointerUnlocked");
        hadPointer = on;
      });
      // захват не удался (Chrome ~1 с не даёт захватить снова после Esc) — игра должна знать, что мышь свободна
      document.addEventListener("pointerlockerror", function () {
        if (window.unityInstance) window.unityInstance.SendMessage("Game", "PointerLockFailed");
      });
    </script>
  </body>
</html>
