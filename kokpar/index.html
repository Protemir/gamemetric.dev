<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kokpar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --red: #e0393e; --red2: #8f1418; --blue: #3a7be0; --blue2: #13398a; --gold: #ffcf3a; --gold2: #e08a12; --ink: #140f08; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfc7b4; user-select: none; -webkit-user-select: none; touch-action: none; color: #fff; font: 600 15px/1.25 'Rubik', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { display: block; }
  .noui .ui, .noui #lang { display: none !important; }
  .ui { position: fixed; pointer-events: none; }
  .disp { font-family: 'Russo One', 'Rubik', system-ui, sans-serif; letter-spacing: .02em; }
  /* табло */
  #top { top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; } /* без filter: на слабой видеокарте фильтр поверх 3D пересчитывается каждый кадр */
  .team { display: flex; align-items: center; gap: 10px; padding: 6px 14px; min-width: 132px; }
  .team.r { background: linear-gradient(180deg, var(--red), var(--red2)); clip-path: polygon(0 0, 100% 0, 100% 100%, 12px 100%); justify-content: flex-end; border-radius: 10px 0 0 10px; }
  .team.b { background: linear-gradient(180deg, var(--blue), var(--blue2)); clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); border-radius: 0 10px 10px 0; }
  .team .nm { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; opacity: .92; }
  .team .fl { width: 34px; height: 21px; border-radius: 3px; box-shadow: 0 0 0 1.5px rgba(255,255,255,.75), 0 2px 6px rgba(0,0,0,.35); }
  .team .fl:not([src]) { visibility: hidden; }
  .team .sc { font-size: 30px; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  #clock { background: linear-gradient(180deg, #2a2219, #120d08); padding: 6px 14px; font-size: 20px; display: grid; place-items: center; min-width: 64px; border-top: 2px solid rgba(255,207,58,.6); }
  /* баннер */
  #banner { top: 30%; left: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0; transition: transform .22s cubic-bezier(.2,1.6,.4,1), opacity .15s; white-space: nowrap; text-align: center; }
  #banner.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #banner .big { font-size: clamp(40px, 8vw, 84px); line-height: 1.05; background: linear-gradient(180deg, #fff 0%, var(--c1, #ffe58a) 45%, var(--c2, #f0a01c) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 2px rgba(20,12,4,.6); }
  #banner .small { margin-top: 6px; font-size: clamp(14px, 2.2vw, 20px); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #banner .small:empty { display: none; }
  /* силы */
  #stamwrap { left: max(16px, env(safe-area-inset-left)); bottom: 18px; width: 200px; }
  #stamlbl { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 1px 3px rgba(0,0,0,.7); margin-bottom: 4px; }
  #stamtrack { height: 12px; border-radius: 6px; background: rgba(10,8,5,.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); overflow: hidden; }
  #stam { height: 100%; width: 100%; background: linear-gradient(90deg, var(--gold2), var(--gold)); border-radius: 6px; transition: width .1s; }
  /* тартыс */
  #tug { left: 50%; bottom: 20%; transform: translateX(-50%); width: min(460px, 82vw); text-align: center; }
  #tug[hidden] { display: none; }
  #tugtrack { position: relative; height: 22px; border-radius: 11px; background: linear-gradient(90deg, #6b0e10, var(--red) 49.5%, #2d8a3c 50.5%, #46c25a); box-shadow: 0 4px 14px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.25); }
  #tugbar { position: absolute; top: -8px; width: 10px; height: 38px; margin-left: -5px; background: #fff; border-radius: 5px; box-shadow: 0 0 0 2px var(--ink), 0 0 14px #fff; left: 50%; transition: left .06s linear; }
  #tugtip { margin-top: 10px; font-size: 22px; color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.4), 0 0 14px rgba(0,0,0,.35); animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }
  #hint { left: 50%; bottom: 16px; transform: translateX(-50%); background: rgba(14,10,6,.62); padding: 8px 16px; border-radius: 999px; white-space: nowrap; font-size: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  #hint:empty { display: none; }
  #hint kbd { font: 700 12px 'Rubik', sans-serif; background: #fff; color: var(--ink); border-radius: 4px; padding: 1px 5px; margin: 0 2px; box-shadow: 0 2px 0 #9a8f7a; }
  #arrow { font-size: 34px; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
  /* язык */
  #lang { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); font: 700 13px 'Rubik', sans-serif; color: #fff; background: rgba(14,10,6,.55); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 6px 12px; cursor: pointer; letter-spacing: .06em; z-index: 5; }
  /* телефон */
  #stick { position: fixed; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: radial-gradient(rgba(0,0,0,.05), rgba(0,0,0,.25)); display: none; pointer-events: none; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .btn { position: fixed; border: 0; border-radius: 50%; color: #fff; display: none; touch-action: none; font-family: 'Russo One', sans-serif; text-shadow: 0 1px 2px rgba(0,0,0,.5); box-shadow: 0 4px 14px rgba(0,0,0,.35), inset 0 -4px 0 rgba(0,0,0,.25); }
  body.touch .btn { display: block; }
  #btnTug { right: max(22px, env(safe-area-inset-right)); bottom: 34px; width: 100px; height: 100px; font-size: 15px; background: radial-gradient(circle at 40% 30%, #b8862a, #6a4810); }
  #btnTug.ready { background: radial-gradient(circle at 40% 30%, #ffe27a, #e08a12); box-shadow: 0 0 22px var(--gold), inset 0 -4px 0 rgba(0,0,0,.25); }
  #btnWhip { right: 140px; bottom: 26px; width: 74px; height: 74px; font-size: 12px; background: radial-gradient(circle at 40% 30%, #6a6a6a, #2a2a2a); }
  body.touch #stamwrap { left: auto; right: max(22px, env(safe-area-inset-right)); bottom: 150px; width: 100px; }
  /* итог */
  #end { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(rgba(10,8,5,.35), rgba(10,8,5,.75)); }
  #end[hidden] { display: none; }
  #end .panel { text-align: center; }
  #endTitle { font-size: clamp(48px, 10vw, 96px); line-height: 1.05; background: linear-gradient(180deg, #fff, var(--c1, #ffe58a) 50%, var(--c2, #f0a01c)); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 2px rgba(20,12,4,.6); }
  #endScore { font-size: 54px; margin: 12px 0 22px; text-shadow: 0 3px 0 rgba(0,0,0,.35); }
  #again { font: 22px 'Russo One', sans-serif; padding: 14px 34px; border: 0; border-radius: 12px; background: linear-gradient(180deg, var(--gold), var(--gold2)); color: var(--ink); cursor: pointer; box-shadow: 0 6px 0 #8a4f06, 0 10px 24px rgba(0,0,0,.4); }
  #again:active { transform: translateY(4px); box-shadow: 0 2px 0 #8a4f06; }
  /* меню лиги */
  #menu { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, rgba(10,8,5,.25), rgba(10,8,5,.78)); z-index: 6; }
  #menu[hidden] { display: none; }
  #menu .panel { text-align: center; padding: 0 16px; max-width: 760px; }
  #menu .logo { font-size: clamp(56px, 12vw, 120px); line-height: 1; background: linear-gradient(180deg, #fff, #ffe58a 50%, #f0a01c); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 2px rgba(20,12,4,.6); }
  #menu .sub { margin: 8px 0 22px; font-size: 15px; opacity: .9; letter-spacing: .04em; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #menu .ttl { font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: var(--gold); margin-bottom: 12px; text-shadow: 0 2px 0 rgba(0,0,0,.4); }
  .ladder { display: flex; flex-wrap: wrap; justify-content: center; gap: 6px; margin: 0 auto 16px; max-width: 640px; }
  .ladder span { padding: 6px 12px; border-radius: 999px; font-weight: 700; font-size: 13px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); }
  .ladder span { display: inline-flex; align-items: center; gap: 6px; }
  .ladder img { width: 22px; height: 14px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,.6); }
  .ladder .done { background: rgba(70,170,90,.35); }
  .ladder .cur { background: linear-gradient(180deg, var(--gold), var(--gold2)); color: var(--ink); box-shadow: 0 0 16px rgba(255,207,58,.6); }
  .ladder .lock { opacity: .55; }
  .vs { font-size: 17px; margin-bottom: 18px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .vs b { color: var(--foe, #7fb0ff); }
  .big-btn { font: 24px 'Russo One', sans-serif; padding: 16px 44px; border: 0; border-radius: 14px; background: linear-gradient(180deg, var(--gold), var(--gold2)); color: var(--ink); cursor: pointer; box-shadow: 0 6px 0 #8a4f06, 0 10px 24px rgba(0,0,0,.4); }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #8a4f06; }
  .credits { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; font: 500 11px 'Rubik', system-ui; opacity: .7; color: inherit; padding: 0 12px; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(#3a2c1a, #120d08); z-index: 9; color: #fff; }
  #load .t { font-size: clamp(44px, 9vw, 88px); background: linear-gradient(180deg, #fff, #ffe58a 50%, #f0a01c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #load .lbar { width: min(320px, 70vw); height: 8px; margin: 16px auto 0; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
  #load #loadbar { display: block; height: 100%; width: 3%; border-radius: 4px; background: linear-gradient(90deg, #ffe58a, #f0a01c); box-shadow: 0 0 12px rgba(255,190,60,.7); }
  #load .s { margin-top: 8px; text-align: center; letter-spacing: .2em; text-transform: uppercase; opacity: .8; }
  html.rot, html.rot body { overflow: hidden; }
  /* низкий экран (телефон лёжа): меню компактнее */
  html.short #menu .logo { font-size: 46px; }
  html.short #menu .sub { display: none; }
  html.short #menu .ttl { font-size: 14px; margin: 4px 0 6px; }
  html.short .ladder { margin-bottom: 8px; gap: 4px; }
  html.short .ladder span { padding: 3px 8px; font-size: 11px; }
  html.short .vs { font-size: 14px; margin-bottom: 8px; }
  html.short .big-btn { font-size: 19px; padding: 10px 34px; }
  html.short .credits { font-size: 8px; bottom: 2px; opacity: .5; }
  html.rot body { position: fixed; top: 0; left: 0; transform-origin: 0 0; }
</style>

<body>
<div id="load"><div><div class="t disp">KOKPAR</div><div class="s" id="loadtxt">…</div><div class="lbar"><i id="loadbar"></i></div></div><div class="credits" data-credits></div></div>
<script>
// полоса загрузки: сначала движок (без данных о байтах — ползёт до 15%), потом кони и всадники по байтам
(() => {
  const ru = !/[?&]lang=en/.test(location.search) && (/[?&]lang=ru/.test(location.search) || /^(ru|kk)/i.test(navigator.language));
  const L = ru ? ['Загружаем степь', 'Седлаем коней', 'Зовём всадников', 'Выводим на поле'] : ['Loading the steppe', 'Saddling the horses', 'Calling the riders', 'Heading to the field'];
  const got = { horse: 0, rider: 0 }, TOTAL = 2.55e6;
  let shown = 0.03, target = 0.03, label = L[0];
  window.__loadProg = (k, n) => { got[k] = n; target = Math.max(target, 0.15 + 0.75 * Math.min(1, (got.horse + got.rider) / TOTAL)); label = got.horse > 1.3e6 ? L[2] : L[1]; };
  window.__loadDone = () => { target = 1; label = L[3]; };
  const bar = document.getElementById('loadbar'), txt = document.getElementById('loadtxt');
  const tick = () => {
    if (!bar.isConnected) return;
    if (target < 0.15) target = Math.min(0.15, target + 0.0007);
    shown += (target - shown) * 0.1;
    bar.style.width = (shown * 100).toFixed(1) + '%';
    txt.textContent = label + ' · ' + Math.round(shown * 100) + '%';
    requestAnimationFrame(tick);
  };
  tick();
})();
</script>
