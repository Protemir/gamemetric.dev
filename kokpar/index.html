<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Kokpar</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Russo+One&family=Rubik:wght@500;700;900&display=swap" rel="stylesheet">
<style>
  :root { --red: #e0393e; --red2: #8f1418; --blue: #3a7be0; --blue2: #13398a; --gold: #ffcf3a; --gold2: #e08a12; --ink: #140f08; }
  html, body { margin: 0; height: 100%; overflow: hidden; background: #cfc7b4; user-select: none; -webkit-user-select: none; touch-action: none; color: #fff; font: 600 15px/1.25 'Rubik', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
  canvas { display: block; }
  .noui .ui, .noui #lang { display: none !important; }
  .ui { position: fixed; pointer-events: none; }
  .disp { font-family: 'Russo One', 'Rubik', system-ui, sans-serif; letter-spacing: .02em; }
  /* табло */
  #top { top: max(10px, env(safe-area-inset-top)); left: 50%; transform: translateX(-50%); display: flex; align-items: stretch; } /* без filter: на слабой видеокарте фильтр поверх 3D пересчитывается каждый кадр */
  .team { display: flex; align-items: center; gap: 10px; padding: 6px 14px; min-width: 132px; }
  .team.r { background: linear-gradient(180deg, var(--red), var(--red2)); clip-path: polygon(0 0, 100% 0, 100% 100%, 12px 100%); justify-content: flex-end; border-radius: 10px 0 0 10px; }
  .team.b { background: linear-gradient(180deg, var(--blue), var(--blue2)); clip-path: polygon(0 0, 100% 0, calc(100% - 12px) 100%, 0 100%); border-radius: 0 10px 10px 0; }
  .team .nm { max-width: 170px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; opacity: .92; }
  .team .fl { width: 34px; height: 21px; border-radius: 3px; box-shadow: 0 0 0 1.5px rgba(255,255,255,.75), 0 2px 6px rgba(0,0,0,.35); }
  .team .fl:not([src]) { visibility: hidden; }
  .team .sc { font-size: 30px; line-height: 1; text-shadow: 0 2px 0 rgba(0,0,0,.25); }
  #clock { background: linear-gradient(180deg, #2a2219, #120d08); padding: 6px 14px; font-size: 20px; display: grid; place-items: center; min-width: 64px; border-top: 2px solid rgba(255,207,58,.6); }
  /* баннер */
  #banner { top: 30%; left: 50%; transform: translate(-50%, -50%) scale(.6); opacity: 0; transition: transform .22s cubic-bezier(.2,1.6,.4,1), opacity .15s; white-space: nowrap; text-align: center; }
  #banner.on { opacity: 1; transform: translate(-50%, -50%) scale(1); }
  #banner .big { font-size: clamp(40px, 8vw, 84px); line-height: 1.05; background: linear-gradient(180deg, #fff 0%, var(--c1, #ffe58a) 45%, var(--c2, #f0a01c) 100%); -webkit-background-clip: text; background-clip: text; color: transparent; -webkit-text-stroke: 2px rgba(20,12,4,.6); }
  #banner .small { margin-top: 6px; font-size: clamp(14px, 2.2vw, 20px); font-weight: 700; text-transform: uppercase; letter-spacing: .14em; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #banner .small:empty { display: none; }
  /* силы */
  #stamwrap { left: max(16px, env(safe-area-inset-left)); bottom: 18px; width: 200px; }
  #stamlbl { font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; text-shadow: 0 1px 3px rgba(0,0,0,.7); margin-bottom: 4px; }
  #stamtrack { height: 12px; border-radius: 6px; background: rgba(10,8,5,.55); box-shadow: inset 0 0 0 1px rgba(255,255,255,.18); overflow: hidden; }
  #stam { height: 100%; width: 100%; background: linear-gradient(90deg, var(--gold2), var(--gold)); border-radius: 6px; transition: width .1s; }
  /* тартыс */
  #pow { right: 26%; top: 50%; transform: translateY(-50%); display: flex; flex-direction: column; align-items: center; gap: 6px; }
  #pow[hidden] { display: none; }
  #powtrack { position: relative; width: 18px; height: min(200px, 34vh); border-radius: 9px; background: rgba(0,0,0,.45); box-shadow: inset 0 0 0 2px rgba(255,255,255,.35), 0 4px 14px rgba(0,0,0,.4); overflow: hidden; }
  #powbar { position: absolute; left: 0; right: 0; bottom: 0; background: linear-gradient(0deg, #ffe58a, #f0a01c 60%, #e0393e); }
  #pow.hit #powbar { background: linear-gradient(0deg, #b8ffc4, #3fd264); box-shadow: 0 0 16px #3fd264; }
  #pow b { font-size: 18px; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #tug { left: 50%; bottom: 20%; transform: translateX(-50%); width: min(460px, 82vw); text-align: center; }
  #tug[hidden] { display: none; }
  #tugtrack { position: relative; height: 22px; border-radius: 11px; background: linear-gradient(90deg, #6b0e10, var(--red) 49.5%, #2d8a3c 50.5%, #46c25a); box-shadow: 0 4px 14px rgba(0,0,0,.45), inset 0 0 0 2px rgba(255,255,255,.25); }
  #tugbar { position: absolute; top: -8px; width: 10px; height: 38px; margin-left: -5px; background: #fff; border-radius: 5px; box-shadow: 0 0 0 2px var(--ink), 0 0 14px #fff; left: 50%; transition: left .06s linear; }
  #tugtip { margin-top: 10px; font-size: 22px; color: var(--gold); text-shadow: 0 2px 0 rgba(0,0,0,.4), 0 0 14px rgba(0,0,0,.35); animation: pulse .5s ease-in-out infinite alternate; }
  @keyframes pulse { to { transform: scale(1.08); } }
  #hint { left: 50%; bottom: 16px; transform: translateX(-50%); background: rgba(14,10,6,.62); padding: 8px 16px; border-radius: 999px; white-space: nowrap; font-size: 14px; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
  #hint:empty { display: none; }
  #hint kbd { font: 700 12px 'Rubik', sans-serif; background: #fff; color: var(--ink); border-radius: 4px; padding: 1px 5px; margin: 0 2px; box-shadow: 0 2px 0 #9a8f7a; }
  #arrow { font-size: 34px; font-weight: 900; text-shadow: 0 2px 4px rgba(0,0,0,.6); }
  /* язык */
  #lang { position: fixed; top: max(10px, env(safe-area-inset-top)); right: max(12px, env(safe-area-inset-right)); font: 700 13px 'Rubik', sans-serif; color: #fff; background: rgba(14,10,6,.55); border: 1px solid rgba(255,255,255,.25); border-radius: 999px; padding: 6px 12px; cursor: pointer; letter-spacing: .06em; z-index: 5; }
  /* телефон */
  #stick { position: fixed; width: 124px; height: 124px; margin: -62px 0 0 -62px; border-radius: 50%; border: 2px solid rgba(255,255,255,.55); background: radial-gradient(rgba(0,0,0,.05), rgba(0,0,0,.25)); display: none; pointer-events: none; }
  #stick i { position: absolute; left: 50%; top: 50%; width: 50px; height: 50px; margin: -25px 0 0 -25px; border-radius: 50%; background: rgba(255,255,255,.85); box-shadow: 0 2px 8px rgba(0,0,0,.4); }
  .btn { position: fixed; border: 0; border-radius: 50%; color: #fff; display: none; touch-action: none; font-family: 'Russo One', sans-serif; text-shadow: 0 1px 2px rgba(0,0,0,.5); box-shadow: 0 4px 14px rgba(0,0,0,.35), inset 0 -4px 0 rgba(0,0,0,.25); }
  body.touch .btn { display: block; }
  #btnTug { right: max(22px, env(safe-area-inset-right)); bottom: 34px; width: 100px; height: 100px; font-size: 15px; background: radial-gradient(circle at 40% 30%, #b8862a, #6a4810); }
  #btnTug.ready { background: radial-gradient(circle at 40% 30%, #ffe27a, #e08a12); box-shadow: 0 0 22px var(--gold), inset 0 -4px 0 rgba(0,0,0,.25); }
  #btnWhip { right: 140px; bottom: 26px; width: 74px; height: 74px; font-size: 12px; background: radial-gradient(circle at 40% 30%, #6a6a6a, #2a2a2a); }
  body.touch #stamwrap { left: auto; right: max(22px, env(safe-area-inset-right)); bottom: 150px; width: 100px; }
  #menu { position: fixed; inset: 0; display: grid; place-items: center; background: linear-gradient(180deg, rgba(10,8,5,.25), rgba(10,8,5,.78)); z-index: 6; }
  #menu[hidden] { display: none; }
  .big-btn:active { transform: translateY(4px); box-shadow: 0 2px 0 #8a4f06; }
  .credits { position: fixed; left: 0; right: 0; bottom: 8px; text-align: center; font: 500 11px 'Rubik', system-ui; opacity: .7; color: inherit; padding: 0 12px; }
  #load { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(#3a2c1a, #120d08); z-index: 9; color: #fff; }
  #load .t { font-size: clamp(44px, 9vw, 88px); background: linear-gradient(180deg, #fff, #ffe58a 50%, #f0a01c); -webkit-background-clip: text; background-clip: text; color: transparent; }
  #load .lbar { width: min(320px, 70vw); height: 8px; margin: 16px auto 0; border-radius: 4px; background: rgba(255,255,255,.12); overflow: hidden; box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
  #load #loadbar { display: block; height: 100%; width: 3%; border-radius: 4px; background: linear-gradient(90deg, #ffe58a, #f0a01c); box-shadow: 0 0 12px rgba(255,190,60,.7); }
  #load .s { margin-top: 8px; text-align: center; letter-spacing: .2em; text-transform: uppercase; opacity: .8; }

  /* ---------- хаб: клуб, Лига чемпионов, конюшня ---------- */
  #menu { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, rgba(10,8,5,.35), rgba(10,8,5,.82)); z-index: 6; padding: 10px; }
  #menu[hidden] { display: none; }
  .hub { position: relative; width: min(720px, 96vw); max-height: calc(100% - 26px); overflow: auto; text-align: center; padding: 18px 22px 20px; border-radius: 20px;
    background: linear-gradient(180deg, rgba(40,29,15,.9), rgba(16,11,6,.94)); box-shadow: 0 24px 60px rgba(0,0,0,.55), inset 0 0 0 1px rgba(255,214,130,.22), inset 0 1px 0 rgba(255,240,200,.18); scrollbar-width: thin; }
  .hub::before { content: ''; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; background: radial-gradient(ellipse at 50% -10%, rgba(255,200,90,.22), transparent 60%); }
  .hub button { font: inherit; color: inherit; cursor: pointer; }
  .hub button:disabled { cursor: default; opacity: .45; }
  .h-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; margin-bottom: 8px; }
  .h-club { display: flex; align-items: center; gap: 10px; padding: 6px 12px 6px 6px; border: 0; border-radius: 12px; background: rgba(255,255,255,.07); font-weight: 700; font-size: 15px; max-width: 60%; }
  .h-club:hover { background: rgba(255,255,255,.13); }
  .h-club img { width: 46px; height: 29px; border-radius: 4px; box-shadow: 0 0 0 1.5px rgba(255,255,255,.7), 0 3px 8px rgba(0,0,0,.4); flex: none; }
  .h-club span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .h-money { padding: 6px 14px; border-radius: 12px; background: linear-gradient(180deg, rgba(255,207,58,.22), rgba(240,140,20,.12)); box-shadow: inset 0 0 0 1px rgba(255,207,58,.45); font: 20px 'Russo One', sans-serif; color: #ffe58a; text-align: right; line-height: 1.05; }
  .h-money small { display: block; font: 700 10px 'Rubik', sans-serif; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,240,200,.65); }
  .h-cup { font-size: clamp(22px, 4.4vw, 34px); letter-spacing: .04em; text-transform: uppercase; background: linear-gradient(180deg, #fff, #ffe58a 55%, #f0a01c); -webkit-background-clip: text; background-clip: text; color: transparent; filter: drop-shadow(0 2px 0 rgba(0,0,0,.45)); margin-top: 4px; }
  .h-season { font-size: 13px; letter-spacing: .1em; text-transform: uppercase; opacity: .7; margin: 2px 0 12px; }
  .h-stage { display: inline-block; padding: 5px 14px; border-radius: 999px; background: rgba(255,207,58,.16); box-shadow: inset 0 0 0 1px rgba(255,207,58,.4); color: #ffe58a; font-weight: 700; font-size: 13px; letter-spacing: .08em; text-transform: uppercase; }
  .h-stage.big { font: 20px 'Russo One', sans-serif; padding: 8px 20px; margin: 6px 0 14px; letter-spacing: .03em; }
  .h-match { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 12px; margin: 16px 0 6px; }
  .h-side { display: flex; flex-direction: column; align-items: center; gap: 8px; min-width: 0; }
  .h-side img { width: min(140px, 30vw); aspect-ratio: 8 / 5; border-radius: 6px; box-shadow: 0 0 0 2px rgba(255,255,255,.8), 0 10px 24px rgba(0,0,0,.5); animation: wave 4s ease-in-out infinite; transform-origin: left center; }
  .h-side:last-child img { animation-delay: -2s; }
  @keyframes wave { 50% { transform: perspective(300px) rotateY(-9deg) skewY(-1.5deg); } }
  .h-side b { font-size: 16px; line-height: 1.2; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  .h-vs { font-size: 36px; color: #ffcf3a; text-shadow: 0 0 18px rgba(255,180,40,.6), 0 3px 0 rgba(0,0,0,.5); }
  .h-stars { color: #ffcf3a; letter-spacing: 2px; font-size: 14px; }
  .h-stars i { font-style: normal; color: rgba(255,255,255,.2); }
  .h-arena { font-size: 13px; opacity: .75; margin: 6px 0 14px; }
  .h-arena::before { content: '⛰ '; }
  .h-tabs { display: flex; justify-content: center; gap: 10px; margin-top: 16px; flex-wrap: wrap; }
  .h-tabs button, .h-stat button { border: 0; padding: 10px 20px; border-radius: 12px; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.16); font-weight: 700; font-size: 14px; letter-spacing: .04em; }
  .h-tabs button:hover:not(:disabled), .h-stat button:hover:not(:disabled) { background: rgba(255,255,255,.18); }
  .h-trophy { font-size: 64px; filter: drop-shadow(0 6px 14px rgba(255,190,40,.5)); margin-top: 8px; }
  .h-gt { font: 15px 'Russo One', sans-serif; letter-spacing: .06em; text-transform: uppercase; color: #ffe58a; margin: 14px 0 8px; }
  .h-groups { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  .h-group { flex: 1 1 280px; max-width: 340px; }
  .h-group .h-gt { margin-top: 4px; }
  .hub table { width: 100%; border-collapse: collapse; font-size: 14px; }
  .hub th { font-size: 11px; opacity: .55; font-weight: 700; padding: 0 4px 4px; }
  .hub td { padding: 6px 4px; border-top: 1px solid rgba(255,255,255,.08); }
  .hub td.n { text-align: left; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
  .hub td img { width: 26px; height: 16px; border-radius: 2px; box-shadow: 0 0 0 1px rgba(255,255,255,.55); }
  .hub tr.up td:first-child { color: #7fe08f; font-weight: 700; }
  .hub tr.me td { background: rgba(255,207,58,.12); }
  .hub tr.me td.n { font-weight: 700; color: #ffe58a; }
  .h-bracket { display: flex; gap: 12px; justify-content: center; align-items: center; flex-wrap: wrap; }
  .h-tie { min-width: 180px; border-radius: 10px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); overflow: hidden; }
  .h-tie > div { display: flex; align-items: center; gap: 8px; padding: 7px 10px; font-size: 14px; }
  .h-tie > div + div { border-top: 1px solid rgba(255,255,255,.08); }
  .h-tie img { width: 26px; height: 16px; border-radius: 2px; }
  .h-tie b { margin-left: auto; color: #ffe58a; }
  .h-final { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .h-final span { font: 12px 'Russo One', sans-serif; letter-spacing: .1em; color: #ffcf3a; text-transform: uppercase; }
  .h-final .h-tie { box-shadow: inset 0 0 0 1.5px rgba(255,207,58,.6), 0 0 18px rgba(255,190,40,.25); }
  .h-stats { display: grid; gap: 8px; margin-top: 6px; }
  .h-stat { display: grid; grid-template-columns: 1fr auto auto; gap: 14px; align-items: center; text-align: left; padding: 10px 12px; border-radius: 12px; background: rgba(255,255,255,.05); box-shadow: inset 0 0 0 1px rgba(255,255,255,.08); }
  .h-stat b { display: block; font-size: 15px; }
  .h-stat small { opacity: .65; font-size: 12px; }
  .h-pips { display: flex; gap: 4px; }
  .h-pips i { width: 14px; height: 14px; border-radius: 3px; background: rgba(255,255,255,.12); transform: skewX(-12deg); }
  .h-pips i.on { background: linear-gradient(180deg, #ffe58a, #f0a01c); box-shadow: 0 0 8px rgba(255,190,40,.6); }
  .h-stat button:not(:disabled) { background: linear-gradient(180deg, #ffd34d, #e8930f); color: #1d1206; box-shadow: 0 3px 0 #8a4f06; }
  .h-coats { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 8px; }
  .h-coat { display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border: 0; border-radius: 12px; background: rgba(255,255,255,.06); box-shadow: inset 0 0 0 1px rgba(255,255,255,.1); }
  .h-coat i { width: 34px; height: 34px; border-radius: 50%; box-shadow: inset 0 -6px 10px rgba(0,0,0,.35), 0 0 0 2px rgba(255,255,255,.3); }
  .h-coat small { font-size: 11px; opacity: .75; }
  .h-coat.sel { box-shadow: inset 0 0 0 2px #ffcf3a, 0 0 14px rgba(255,190,40,.35); }
  .h-preview img { width: min(240px, 52vw); aspect-ratio: 8 / 5; border-radius: 8px; box-shadow: 0 0 0 2px rgba(255,255,255,.85), 0 14px 30px rgba(0,0,0,.55); margin: 10px 0 6px; animation: wave 4s ease-in-out infinite; transform-origin: left center; }
  .h-lbl { display: block; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; opacity: .7; margin: 12px 0 6px; }
  .h-lbl input { display: block; width: min(360px, 80vw); margin: 6px auto 0; padding: 10px 14px; border-radius: 10px; border: 0; outline: 0; background: rgba(255,255,255,.1); box-shadow: inset 0 0 0 1px rgba(255,255,255,.2); color: #fff; font: 700 18px 'Rubik', sans-serif; text-align: center; letter-spacing: 0; text-transform: none; }
  .h-lbl input:focus { box-shadow: inset 0 0 0 2px #ffcf3a; }
  .h-sws { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
  .h-sw { width: 34px; height: 34px; border-radius: 50%; border: 0; box-shadow: inset 0 -5px 8px rgba(0,0,0,.3), 0 0 0 2px rgba(255,255,255,.18); }
  .h-sw.sel { box-shadow: inset 0 -5px 8px rgba(0,0,0,.3), 0 0 0 3px #ffcf3a, 0 0 12px rgba(255,190,40,.6); }
  .h-sgs { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 16px; }
  .h-sg { padding: 3px; border: 0; border-radius: 6px; background: transparent; }
  .h-sg img { display: block; width: 52px; height: 32px; border-radius: 3px; }
  .h-sg.sel { box-shadow: 0 0 0 2px #ffcf3a; }
  .r-title { font-size: clamp(40px, 8vw, 72px); }
  .result.loss .r-title { background: linear-gradient(180deg, #fff, #cfcfcf 55%, #7d7d7d); -webkit-background-clip: text; background-clip: text; }
  .r-score { display: flex; justify-content: center; align-items: center; gap: 18px; margin: 6px 0 10px; }
  .r-score img { width: min(96px, 20vw); aspect-ratio: 8 / 5; border-radius: 5px; box-shadow: 0 0 0 2px rgba(255,255,255,.8), 0 8px 18px rgba(0,0,0,.5); }
  .r-score span { font-size: 52px; text-shadow: 0 3px 0 rgba(0,0,0,.4); }
  .r-prize { max-width: 360px; margin: 0 auto 6px; }
  .r-prize > div:not(.h-gt) { display: flex; justify-content: space-between; padding: 4px 2px; font-size: 14px; border-top: 1px solid rgba(255,255,255,.06); }
  .r-prize b { color: #ffe58a; }
  .r-prize .tot { font: 18px 'Russo One', sans-serif; border-top: 1px solid rgba(255,207,58,.4) !important; padding-top: 8px !important; }
  .result .big-btn, .hub > .big-btn { margin-top: 14px; }
  .big-btn { font: 24px 'Russo One', sans-serif; padding: 16px 44px; border: 0; border-radius: 14px; background: linear-gradient(180deg, var(--gold), var(--gold2)); color: var(--ink); cursor: pointer; box-shadow: 0 6px 0 #8a4f06, 0 10px 24px rgba(0,0,0,.4); }
  .big-btn:hover { filter: brightness(1.08); }
  html.short .hub { padding: 10px 14px 12px; max-height: calc(100% - 14px); }
  html.short .h-cup { font-size: 20px; }
  html.short .h-season { margin-bottom: 6px; }
  html.short .h-match { margin: 8px 0 2px; }
  html.short .h-side img { width: 92px; }
  html.short .h-vs { font-size: 26px; }
  html.short .h-tabs { margin-top: 8px; }
  html.short .h-tabs button { padding: 7px 14px; }
  html.short .r-title { font-size: 34px; }
  html.short .r-score span { font-size: 36px; }
  @media (max-width: 520px) { .h-stat { grid-template-columns: 1fr auto; } .h-stat button { grid-column: 1 / -1; } }
  html.rot, html.rot body { overflow: hidden; }
  /* низкий экран (телефон лёжа): меню компактнее */
  html.short .big-btn { font-size: 19px; padding: 10px 34px; }
  html.short .credits { font-size: 8px; bottom: 2px; opacity: .5; }

<script>
// полоса загрузки: сначала движок (без данных о байтах — ползёт до 15%), потом кони и всадники по байтам
(() => {
  const ru = !/[?&]lang=en/.test(location.search) && (/[?&]lang=ru/.test(location.search) || /^(ru|kk)/i.test(navigator.language));
  const L = ru ? ['Загружаем степь', 'Седлаем коней', 'Зовём всадников', 'Выводим на поле'] : ['Loading the steppe', 'Saddling the horses', 'Calling the riders', 'Heading to the field'];
  const got = { horse: 0, rider: 0 }, TOTAL = 2.55e6;
  let shown = 0.03, target = 0.03, label = L[0];
  window.__loadProg = (k, n) => { got[k] = n; target = Math.max(target, 0.15 + 0.75 * Math.min(1, (got.horse + got.rider) / TOTAL)); label = got.horse > 1.3e6 ? L[2] : L[1]; };
  window.__loadDone = () => { target = 1; label = L[3]; };
  const bar = document.getElementById('loadbar'), txt = document.getElementById('loadtxt');
  const tick = () => {
    if (!bar.isConnected) return;
    if (target < 0.15) target = Math.min(0.15, target + 0.0007);
    shown += (target - shown) * 0.1;
    bar.style.width = (shown * 100).toFixed(1) + '%';
    txt.textContent = label + ' · ' + Math.round(shown * 100) + '%';
    requestAnimationFrame(tick);
  };
  tick();
})();
</script>
