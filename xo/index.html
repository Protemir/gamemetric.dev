<body data-view="menu">

<header class="top">
  <a class="home" id="home" href="../">
    <svg class="mark" viewBox="0 0 32 32" aria-hidden="true">
      <rect x="2" y="2" width="12" height="12" rx="3" fill="#f4b93a"/>
      <rect x="18" y="2" width="12" height="12" rx="3" fill="#e0393e"/>

    <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>
    <span data-t="menu">Меню</span>
  </button>
  <div class="tools">
    <span class="tag" id="modeTag" hidden></span>
    <button type="button" class="icon" id="sound" aria-pressed="true" data-t-label="sound" aria-label="Звук">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path class="spk" d="M4 9.6h3.2L12 5.6v12.8l-4.8-4H4z"/>
        <path class="wave" d="M15.4 9.2a4 4 0 010 5.6M17.9 6.6a7.6 7.6 0 010 10.8"/>

    </nav>
  </div>
</header>

<main>
  <section class="view menu" id="menu">
    <div class="intro">
      <div class="art" id="art" aria-hidden="true"></div>
      <h1 data-t="h1">Крестики-нолики</h1>
      <p class="lead" data-t="lead">Три в ряд — и победа. Играй с другом на одном экране или один против бота.</p>
    </div>

    <div class="modes">
      <button type="button" class="mode duo" data-start="duo">
        <span class="mode-ico" aria-hidden="true">
          <svg viewBox="0 0 24 24"><circle cx="8.6" cy="8" r="3.3"/><path d="M2.4 19.2c0-3.4 2.8-5.7 6.2-5.7s6.2 2.3 6.2 5.7"/><circle cx="16.9" cy="8.8" r="2.6"/><path d="M16.2 13.6c3-.1 5.4 1.9 5.4 5"/></svg>
        </span>
        <span class="mode-text"><b data-t="duo.name">Вдвоём</b><small data-t="duo.desc">На одном экране, по очереди</small></span>
        <span class="go" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M9.5 6.8v10.4l8.2-5.2z"/></svg></span>
      </button>

      <div class="mode bot" role="group" aria-labelledby="botName">
        <div class="mode-head">
          <span class="mode-ico" aria-hidden="true">
            <svg viewBox="0 0 24 24"><rect x="4" y="8" width="16" height="11.5" rx="3.6"/><path d="M12 8V4.6M1.8 12.6v3.2M22.2 12.6v3.2"/><circle class="dot" cx="12" cy="3.6" r="1.2"/><circle class="dot" cx="9" cy="13.6" r="1.4"/><circle class="dot" cx="15" cy="13.6" r="1.4"/></svg>
          </span>
          <span class="mode-text"><b id="botName" data-t="bot.name">С ботом</b><small data-t="bot.desc">Играй один — выбери уровень</small></span>
        </div>
        <div class="levels">
          <button type="button" class="level" data-start="bot-easy" style="--c:#b7e34a">
            <span class="dots" aria-hidden="true"><i class="on"></i><i></i><i></i></span><span data-t="lv.easy">Лёгкий</span>
          </button>
          <button type="button" class="level" data-start="bot-mid" style="--c:#f4b93a">
            <span class="dots" aria-hidden="true"><i class="on"></i><i class="on"></i><i></i></span><span data-t="lv.mid">Средний</span>
          </button>
          <button type="button" class="level" data-start="bot-hard" style="--c:#ff5d6c">
            <span class="dots" aria-hidden="true"><i class="on"></i><i class="on"></i><i class="on"></i></span><span data-t="lv.hard">Непобедимый</span>
          </button>
        </div>
      </div>
    </div>
  </section>

  <section class="view game" id="game" hidden>
    <div class="score">
      <div class="side x" id="sideX">
        <span class="who"><svg class="m x mini" viewBox="0 0 100 100" aria-hidden="true"><path d="M26 26L74 74"/><path d="M74 26L26 74"/></svg><span id="whoX">Игрок 1</span></span>
        <b class="num" id="numX">0</b>
      </div>
      <div class="draws">
        <span class="who" data-t="draws">Ничьи</span>
        <b class="num" id="numD">0</b>
      </div>
      <div class="side o" id="sideO">
        <span class="who"><svg class="m o mini" viewBox="0 0 100 100" aria-hidden="true"><path d="M50 25.5a24.5 24.5 0 1 1 0 49 24.5 24.5 0 1 1 0-49z"/></svg><span id="whoO">Игрок 2</span></span>
        <b class="num" id="numO">0</b>
      </div>
    </div>

    <div class="board" id="board" role="group" data-t-label="board" aria-label="Игровое поле"></div>

    <p class="status" id="status" role="status" aria-live="polite"></p>

    <div class="actions">
      <button type="button" class="btn" id="again">Заново</button>
      <button type="button" class="btn ghost" id="reset" data-t="reset">Сбросить счёт</button>
    </div>
  </section>

  <noscript><p class="noscript">Для игры нужен JavaScript. This game needs JavaScript.</p></noscript>
