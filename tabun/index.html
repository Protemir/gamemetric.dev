<div id="stage">

  <div id="labels"></div>

    </div>
    <div id="logo"><h1 class="disp" id="logoT"></h1><div class="orn" aria-hidden="true"></div><p id="logoS"></p></div>
    <div id="rail">

      <div id="lvlRow"><div id="path"></div><span id="lvlName" class="hidden"></span><span id="bossTag" class="hidden"></span></div>

      <div class="upsHead"><span id="upsTitle"></span><span id="aulInfo"></span></div>

      <h2 id="resT" class="disp"></h2>
      <p id="resSub"></p>
